name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build source/Lighthouse.slnx -c Release
      - name: Test
        run: dotnet test source/tests/Lighthouse.Tests -c Release --no-build --logger "console;verbosity=normal"
